# cargo-deny 0.20.2 -- licenses for Hertzline/core (MIT distribution).
# Verified against EmbarkStudios cargo-deny docs 2026-11-13.
# CI runs: cargo deny check licenses
#
# MPL-2.0 appears only via Tauri spike transitive crates (cssparser stack /
# option-ext). File-level copyleft; accepted for the D1 spike path and documented
# in NOTICE. Not an approval to link LibreHardwareMonitor (D4 rejected).

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[licenses]
version = 2
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "OpenSSL",
    "MPL-2.0",
]

[licenses.private]
ignore = true
