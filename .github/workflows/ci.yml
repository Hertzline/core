# Measurement CI matrix (HZ-013): windows/ubuntu/macos + lint + license audit.
# Actions and reusable workflows pinned to commit SHAs (REPOS.md / RULES.md).
# Hertzline/.github pin: f4f947f31a5da82d0ca4828917490d2a1d1217b0 (HZ-003).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shared:
    uses: Hertzline/.github/.github/workflows/reusable-ci.yml@f4f947f31a5da82d0ca4828917490d2a1d1217b0
    with:
      meta-ref: f4f947f31a5da82d0ca4828917490d2a1d1217b0
      pin-check: true
      license-audit: true
      has-secrets: false

  lint:
    name: lint (${{ matrix.os }})
    needs: [shared]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: rustfmt
        run: cargo fmt -p hertzline-core -- --check

      - name: clippy (zero warnings)
        run: cargo clippy -p hertzline-core --locked -- -D warnings

  core-test:
    name: core-test (${{ matrix.os }})
    needs: [shared]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - name: Test hertzline-core (zero warnings)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test -p hertzline-core --locked

  d1-tauri-build:
    name: d1-tauri (${{ matrix.os }})
    needs: [shared]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - name: Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"

      - name: Linux WebKit deps
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Tauri CLI deps
        working-directory: spikes/d1-tauri
        run: npm ci

      - name: Build d1-tauri (no bundle)
        working-directory: spikes/d1-tauri
        run: npx tauri build --no-bundle

      - name: Smoke IPC (no window)
        env:
          HERTZLINE_D1_SMOKE: "1"
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            bin="$(find target/release -name 'd1-tauri.exe' -type f | head -n1)"
          else
            bin="$(find target/release -name d1-tauri -type f | head -n1)"
          fi
          test -n "${bin}"
          start_ms="$(python3 -c 'import time; print(int(time.time()*1000))')"
          "${bin}"
          code=$?
          end_ms="$(python3 -c 'import time; print(int(time.time()*1000))')"
          size="$(wc -c < "${bin}" | tr -d ' ')"
          echo "smoke_exit=${code} cold_ms=$((end_ms-start_ms)) path=${bin} size=${size}"
          test "${code}" -eq 0

  d1-avalonia-build:
    name: d1-avalonia (${{ matrix.os }})
    needs: [shared]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: .NET SDK
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Linux Avalonia deps
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libx11-dev libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev

      - name: Build Avalonia spike
        working-directory: spikes/d1-avalonia
        run: dotnet build -c Release

      - name: Smoke IPC (no window)
        working-directory: spikes/d1-avalonia
        env:
          HERTZLINE_D1_SMOKE: "1"
        run: dotnet run -c Release --no-build
